# =============================================================================
# SAC (BC-only, joint-space) eval, single-arm push-bottle task
# =============================================================================
# Deploys outputs/bc_jointspace_v1 (BC pretrained on demos_v2_jointspace,
# held-out correlation +0.995-0.996 -- see train_rl_push_bottle_jointspace.yaml
# for the full context on why joint-space vs the old EE-delta convention)
# through the exact same real-hardware eval loop already validated for ACT
# tonight: run_joint_policy_eval.py, no action_processor/IK, the policy's
# raw joint-position output goes straight to env.step().
#
# apply_all_patches() (already called by run_joint_policy_eval.py's main())
# already includes patch_sac_deterministic_inference() (tanh(mean), not a
# fresh stochastic sample every tick) and patch_sac_freeze_temperature() --
# both apply automatically, no extra wiring needed here.
#
# Usage:
#   -v .../outputs/bc_jointspace_v1:/workspace/configs/hilserl/bc_jointspace_poc:ro
#   ros2 run lerobot_control hilserl_eval_joint_policy \
#     --config_path configs/hilserl/eval_sac_jointspace_push_bottle.yaml

env:
  type: gym_manipulator
  name: real_robot
  fps: 10

  features:
    state:
      type: STATE
      shape: [7]
    wrist_r_image:
      type: VISUAL
      shape: [128, 128, 3]
    joint_action:
      type: ACTION
      shape: [7]
  features_map:
    state: observation.state
    wrist_r_image: observation.images.wrist_r
    joint_action: action

  robot:
    type: anvil_openarm_follower
    ros_prefix: follower_r
    joint_state_topic: /joint_states
    command_topic: /follower_r_forward_position_controller/commands
    num_joints: 7
    camera_topics:
      wrist_r: /cam_wrist_r/image_raw/compressed
    control_frequency: 10.0
    max_position_delta: 0.08
    max_command_step_rad: 0.06
    obs_timeout_s: 2.0

  teleop:
    type: anvil_openarm_leader
    ros_prefix: leader_r
    joint_state_topic: /joint_states
    num_joints: 7
    urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
    target_frame_name: leader_r_hand_tcp
    step_sizes:
      x: 0.02
      y: 0.02
      z: 0.02
    obs_timeout_s: 2.0
    policy_controller: follower_r_forward_position_controller
    teleop_controller: teleop_controller
    follower_command_topic: /follower_r_forward_position_controller/commands
    follower_joint_prefix: follower_r

  processor:
    # Unused by run_joint_policy_eval.py (bypasses action_processor
    # entirely) -- present only because HILSerlRobotEnvConfig requires a
    # processor block to parse.
    control_mode: leader
    observation:
      add_joint_velocity_to_observation: false
      add_current_to_observation: false
      add_ee_pose_to_observation: false
      display_cameras: false
    image_preprocessing:
      crop_params_dict: {}
      resize_size: [128, 128]
    gripper:
      use_gripper: false
    reset:
      fixed_reset_joint_positions: null
      reset_time_s: 18.0
      control_time_s: 20.0
      terminate_on_success: true
    inverse_kinematics:
      urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
      target_frame_name: follower_r_hand_tcp
      end_effector_bounds:
        min: [-0.0247, -0.4427, 0.1117]
        max: [0.4159, 0.0418, 0.40]
      end_effector_step_sizes:
        x: 0.02
        y: 0.02
        z: 0.02
    reward_classifier: null

policy:
  type: sac
  vision_encoder_name: /workspace/configs/hilserl/resnet10
  pretrained_path: /workspace/configs/hilserl/bc_jointspace_poc
  device: cuda
  push_to_hub: false
  storage_device: cuda
  use_torch_compile: false
  policy_kwargs:
    std_max: 0.5

output_dir: outputs/hilserl_eval_sac_jointspace
job_name: hilserl_eval_sac_jointspace
seed: 42
batch_size: 16
save_checkpoint: false
save_freq: 999999999
wandb:
  enable: false
