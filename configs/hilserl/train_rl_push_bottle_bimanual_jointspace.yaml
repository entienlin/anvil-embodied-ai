# =============================================================================
# HIL-SERL: bimanual (2-arm, 4-camera) variant of train_rl_push_bottle_jointspace.yaml
# =============================================================================
# Built on the just-validated single-arm joint-space config (see that
# file's own header for the full history of why joint-space replaced
# EE-delta). This is the bimanual extension: same joint-space convention,
# same `processor.inverse_kinematics: null` escape hatch (see this
# project's bimanual task notes -- namespacing the stock EE-delta/IK chain
# for two independent end-effectors would be real, nontrivial new code
# this design deliberately avoids by never engaging it at all), 2 arms
# (14 joints total) and 4 cameras instead of 1+1, PLUS (2026-10-12,
# widened to all 4 arms 2026-10-13) one real gripper dimension PER ARM --
# 16-dim state/action total: [7 left joints, left gripper, 7 right
# joints, right gripper]. Originally wired for follower_r/leader_r only
# (this task's then-current pick-and-place goal only had the right arm
# grasping); widened to all 4 arms because the task's own design (which
# arm picks up what) isn't settled yet and the project needs general
# 4-gripper capability regardless -- see
# env_push_bottle_bimanual_jointspace.yaml's header for the fuller
# rationale and robot_anvil_openarm.py's
# AnvilOpenArmFollowerConfig.use_gripper for the implementation. Each
# gripper's own value is RAW METERS (finger_joint1 is prismatic,
# 0.0-0.05m), not degrees like the 14 arm-joint dimensions.
#
# robot.type/teleop.type here are the NEW composite classes
# (AnvilOpenArmMultiFollower/AnvilOpenArmMultiLeader,
# ros2/src/lerobot_control/lerobot_control/hilserl/robot_anvil_openarm_multi.py
# and teleop_anvil_openarm_multi_leader.py) -- NOT the single-arm
# anvil_openarm_follower/anvil_openarm_leader types train_rl_push_bottle_jointspace.yaml
# uses. The composite classes internally construct one real
# AnvilOpenArmFollower/AnvilOpenArmLeader per `arms` list entry below and
# delegate to them; they are a strict superset (a 1-entry `arms` list
# reproduces the single-arm classes' exact behavior/shapes -- see this
# branch's offline tests), so this config and train_rl_push_bottle_jointspace.yaml
# can coexist indefinitely without the single-arm path changing at all.
#
# Joint/camera ordering convention used throughout this file (state,
# action, and the `arms` lists below) is LEFT ARM FIRST, then RIGHT ARM --
# matching the [left_joints..., right_joints...] convention already
# established elsewhere in this project (configs/lerobot_control/inference_default.yaml,
# configs/mcap_converter/openarm_bimanual.yaml). With a gripper on BOTH
# arms (2026-10-13), each arm contributes its own COMPLETE 8-wide block
# (7 joints + that arm's gripper) in sequence -- AnvilOpenArmMultiFollower/
# AnvilOpenArmMultiLeader build their combined bus/action order by
# concatenating each `arms` entry's OWN full feature list, in list order
# (confirmed via these classes' own offline tests) -- so the real 16-dim
# order is [left_joint1..7, left_gripper, right_joint1..7, right_gripper],
# NOT "all 14 joints then both grippers at the end".
#
# Camera topic names (/cam_waist, /cam_wrist_r, /cam_chest, /cam_wrist_l,
# all .../image_raw/compressed) are this project's REAL, already-used
# naming convention for the bimanual rig's 4 cameras -- taken directly
# from configs/mcap_converter/openarm_bimanual.yaml and
# configs/lerobot_control/inference_default.yaml's camera mappings, not
# invented here. wrist_l/wrist_r are each wired to their own arm's
# AnvilOpenArmFollower sub-controller below; waist/chest (fixed scene
# views, not arm-mounted) are wired to the right arm's sub-controller
# purely as an implementation detail of which ROS2 node subscribes to
# them -- camera ownership between sub-controllers has no behavioral
# effect, since AnvilOpenArmMultiFollower.get_observation() merges every
# arm's images into one combined observation dict regardless of which
# arm's node received them.
#
# Usage -- BC pretrain (offline, no robot/ROS2 needed at runtime), live
# actor/learner -- identical usage pattern to train_rl_push_bottle_jointspace.yaml,
# just pointed at this config instead.
#
# dataset/policy.pretrained_path, 2026-10-12 GRIPPER SCHEMA CHANGE
# (widened to all 4 arms 2026-10-13): env.features.state/joint_action
# above are now 16-dim (14 joints + 1 real gripper PER ARM -- see this
# file's header). The dataset this config USED to point at (the first 10
# real bimanual demos, 2026-10-02, 724 frames, all successful, merged via
# lerobot.datasets.dataset_tools.merge_datasets()) and the bc_bimanual_v1
# checkpoint it produced are BOTH 14-dim -- recorded/trained before any
# gripper existed in this schema. Neither is compatible with this config
# anymore (a 14-dim dataset's "action"/"observation.state" columns will
# not match a 16-dim policy; SACPolicy.from_pretrained() would load a
# 14-dim actor head into a 16-dim config). Both are therefore deliberately
# LEFT UNSET below rather than pointed at stale, incompatible artifacts:
#   1. Collect a FRESH set of demos against
#      env_push_bottle_bimanual_jointspace.yaml (now also 16-dim, gripper
#      wired into all 4 arms) -- needs a human on the real rig, not done yet.
#   2. Point `dataset:` below at that new recording.
#   3. Run a fresh BC pretrain (bc_pretrain.py, BC_OUT for the output
#      path) -- do NOT set policy.pretrained_path to the old
#      bc_bimanual_v1/bc_bimanual_poc checkpoint first (shape mismatch).
#   4. Once that fresh checkpoint exists, point policy.pretrained_path at
#      it for live actor/learner, mirroring train_rl_push_bottle_jointspace.yaml's
#      own comment on that same pattern.

env:
  type: gym_manipulator
  name: real_robot
  fps: 10

  features:
    state:
      type: STATE
      shape: [16]
    wrist_l_image:
      type: VISUAL
      shape: [128, 128, 3]
    wrist_r_image:
      type: VISUAL
      shape: [128, 128, 3]
    waist_image:
      type: VISUAL
      shape: [128, 128, 3]
    chest_image:
      type: VISUAL
      shape: [128, 128, 3]
    joint_action:
      type: ACTION
      shape: [16]
  features_map:
    state: observation.state
    wrist_l_image: observation.images.wrist_l
    wrist_r_image: observation.images.wrist_r
    waist_image: observation.images.waist
    chest_image: observation.images.chest
    joint_action: action

  robot:
    type: anvil_openarm_multi_follower
    arms:
      - ros_prefix: follower_l
        joint_state_topic: /joint_states
        command_topic: /follower_l_forward_position_controller/commands
        num_joints: 7
        camera_topics:
          wrist_l: /cam_wrist_l/image_raw/compressed
        control_frequency: 10.0
        max_position_delta: 0.08
        max_command_step_rad: 0.06
        obs_timeout_s: 2.0
        # Widened from the default 10, 2026-10-12: real-hardware trace data
        # showed follower_l's "liveness watchdog tripped" fault correlates
        # with the policy's coarse-to-fine command-magnitude transition
        # (step-aligned across repeated attempts, not time-aligned),
        # suspected to be a dead-band in the closed OpenArm_v10HW plugin /
        # Damiao firmware (no configurable deadband param exists anywhere
        # in the exposed ros2_control surface -- checked exhaustively).
        # If the condition is transient, a wider window gives the policy's
        # own trajectory room to move past it before this safety net kills
        # the session -- see robot_anvil_openarm.py's _LIVENESS_WINDOW_SIZE
        # comment for the full history/reasoning. Not a fix for the
        # underlying freeze, just a less-trigger-happy safety margin.
        liveness_window_size: 40
        use_gripper: true
      - ros_prefix: follower_r
        joint_state_topic: /joint_states
        command_topic: /follower_r_forward_position_controller/commands
        num_joints: 7
        camera_topics:
          wrist_r: /cam_wrist_r/image_raw/compressed
          waist: /cam_waist/image_raw/compressed
          chest: /cam_chest/image_raw/compressed
        control_frequency: 10.0
        max_position_delta: 0.08
        max_command_step_rad: 0.06
        # Same widening as follower_l above -- this fault has hit both
        # arms at different times across this project's history.
        liveness_window_size: 40
        # See env_push_bottle_bimanual_jointspace.yaml's identical comment --
        # connect()'s real deadline is this * 3 (15s); 2.0 (6s) wasn't
        # always enough for 3 cameras + joint_states to all arrive on a
        # cold connect, even though all 4 topics publish at healthy rates
        # once discovered. follower_l keeps 2.0 (1 camera).
        obs_timeout_s: 5.0
        use_gripper: true

  teleop:
    type: anvil_openarm_multi_leader
    arms:
      - ros_prefix: leader_l
        joint_state_topic: /joint_states
        num_joints: 7
        urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
        target_frame_name: leader_l_hand_tcp
        step_sizes:
          x: 0.02
          y: 0.02
          z: 0.02
        obs_timeout_s: 2.0
        policy_controller: follower_l_forward_position_controller
        teleop_controller: teleop_controller
        follower_command_topic: /follower_l_forward_position_controller/commands
        follower_joint_prefix: follower_l
        # joint_space is REQUIRED for every arm in a multi-leader -- see
        # AnvilOpenArmMultiLeader's docstring for why ee_delta cannot
        # generalize to multiple arms (construction fails loudly if any
        # arm omits this or sets it to ee_delta).
        action_mode: joint_space
        use_gripper: true
      - ros_prefix: leader_r
        joint_state_topic: /joint_states
        num_joints: 7
        urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
        target_frame_name: leader_r_hand_tcp
        step_sizes:
          x: 0.02
          y: 0.02
          z: 0.02
        obs_timeout_s: 2.0
        policy_controller: follower_r_forward_position_controller
        teleop_controller: teleop_controller
        follower_command_topic: /follower_r_forward_position_controller/commands
        follower_joint_prefix: follower_r
        action_mode: joint_space
        use_gripper: true

  processor:
    control_mode: leader
    observation:
      add_joint_velocity_to_observation: false
      add_current_to_observation: false
      add_ee_pose_to_observation: false
      display_cameras: false
    image_preprocessing:
      crop_params_dict: {}
      resize_size: [128, 128]
    gripper:
      # See env_push_bottle_bimanual_jointspace.yaml's identical comment --
      # functionally inert on this joint-space pipeline (confirmed via
      # direct read of lerobot/rl/gym_manipulator.py's make_processors()/
      # make_robot_env()), set true to accurately describe the task.
      use_gripper: true
    reset:
      fixed_reset_joint_positions: null
      reset_time_s: 18.0
      control_time_s: 20.0
      terminate_on_success: true
    # null, not an inverse_kinematics block -- see this file's header and
    # train_rl_push_bottle_jointspace.yaml's own processor.inverse_kinematics
    # comment: this is what makes action_processor reduce to just
    # intervention/reward handling (no EE-delta/IK, which is hardcoded to
    # a single 3-dim ee.x/y/z action and has no bimanual equivalent),
    # letting the policy's raw 16-dim joint-position (+gripper per arm)
    # output flow straight to env.step() for both arms at once.
    inverse_kinematics: null
    reward_classifier: null

# root is a container-internal path -- mount the HOST directory via
# `-v .../data/datasets/<new-gripper-demos-dir>:/tmp/<new-gripper-demos-dir>:ro`.
# 2026-10-12: deliberately NOT pointed at push_bottle_bimanual_demos_combined
# any more -- that dataset is 14-dim (no gripper), incompatible with this
# config's now-16-dim env.features (see this file's header). Point `root`
# at a fresh recording made against the now-also-16-dim
# env_push_bottle_bimanual_jointspace.yaml once one exists.
dataset:
  # 2026-10-19: points at the real recorded grasp-and-place demos (see
  # configs/hilserl/env_push_bottle_bimanual_jointspace.yaml's own
  # dataset: block, same repo_id/root convention) -- was a placeholder
  # path from before any gripper demos existed.
  repo_id: SSTC-AITeam/hilserl-grasp-place-bimanual-jointspace
  # Matches run_hilserl_bimanual.sh's DATASET_HOST mount target exactly
  # (-v "$DATASET_HOST:/tmp/grasp_place_bimanual_demos:ro").
  root: /tmp/grasp_place_bimanual_demos
  video_backend: pyav

policy:
  type: sac
  vision_encoder_name: /workspace/configs/hilserl/resnet10
  # 2026-10-19: bc_grasp_place_v1 -- first real BC checkpoint for this
  # task (5 demos, train-loss-only gate, no held-out set -- see this
  # checkpoint's own training log). Matches run_hilserl_bimanual.sh's
  # mount target exactly.
  pretrained_path: /workspace/configs/hilserl/bc_grasp_place_poc
  device: cuda
  push_to_hub: false
  storage_device: cuda
  use_torch_compile: false
  policy_kwargs:
    std_max: 0.5
  online_steps: 4000
  # 100000, not 10 -- BC-only for this first real-hardware check (matches
  # the established pattern from the push-bottle task: judge the raw BC
  # checkpoint's own behavior before any real gradient step can touch it).
  # Lower this once bc_grasp_place_v1's real-hardware behavior is assessed
  # and RL is actually wanted.
  online_step_before_learning: 100000
  temperature_init: 0.01
  online_buffer_capacity: 2000
  offline_buffer_capacity: 4000
  actor_learner_config:
    learner_host: 127.0.0.1
    learner_port: 50051

output_dir: outputs/hilserl_push_bottle_bimanual_jointspace
job_name: hilserl_push_bottle_bimanual_jointspace
seed: 42
batch_size: 256
# 100, not the stock 250 -- real sessions on this rig have repeatedly been
# cut short by hardware faults well under 250 steps (see the HIL-SERL
# bimanual plan's "follower dead" investigation), so a coarser interval
# risked losing most or all of a session's progress. Checkpoints are
# fully resumable (policy/critic/optimizer state + replay buffers, see
# scripts/run_hilserl_bimanual.sh's --resume flag), so saving more often
# only costs disk, not correctness. Override via --save-freq if needed.
save_freq: 100
wandb:
  enable: false
