# =============================================================================
# HIL-SERL Stage 6: real dataset-informed online training (push-bottle task)
# =============================================================================
# Successor to train_rl_push_bottle_smoketest.yaml, which only proved the
# gRPC actor<->learner plumbing (online_steps: 60, dataset omitted). This
# config is the first attempt at actual training: real dataset wired in
# (RLPD-style 50/50 offline/online mixing once online_step_before_learning
# is reached) and a step budget large enough for a handful of real gradient
# updates to land, not just a connectivity check.
#
# Usage (two separate processes, learner first):
#   ros2 run lerobot_control hilserl_learner --config_path configs/hilserl/train_rl_push_bottle.yaml
#   ros2 run lerobot_control hilserl_actor --config_path configs/hilserl/train_rl_push_bottle.yaml --output_dir=outputs/hilserl_push_bottle_actor
#
# IMPORTANT, confirmed via direct source read (lerobot/policies/factory.py):
# `dataset:` below does NOT pretrain the policy's weights before rollout.
# make_policy() only loads pretrained weights via policy.pretrained_path
# (unset here -- no SAC checkpoint exists yet, this run produces the first
# one). The policy is still randomly initialized at step 0 regardless of
# this dataset -- the dataset only feeds the learner's online/offline batch
# mix (learner.py) once online_step_before_learning is passed. Expect the
# actor to look rough/random for the whole run; that's expected, not a bug
# -- see the plan's "Seventh occurrence and clarified untrained-policy
# question" section for the full explanation.
#
# SAFETY NOTE (unchanged from the smoketest config): real, measured, tight
# end_effector_bounds + AnvilOpenArmFollower's independent ActionLimiter
# joint-space delta clamp are the actual safety margin for this untrained
# policy's raw output, not anything about this dataset/step-count change.

env:
  type: gym_manipulator
  name: real_robot
  fps: 10

  features:
    state:
      type: STATE
      shape: [7]
    wrist_r_image:
      type: VISUAL
      shape: [128, 128, 3]
    ee_delta_action:
      type: ACTION
      shape: [3]
  features_map:
    state: observation.state
    wrist_r_image: observation.images.wrist_r
    ee_delta_action: action

  robot:
    type: anvil_openarm_follower
    ros_prefix: follower_r
    joint_state_topic: /joint_states
    command_topic: /follower_r_forward_position_controller/commands
    num_joints: 7
    camera_topics:
      wrist_r: /cam_wrist_r/image_raw/compressed
    control_frequency: 10.0
    max_position_delta: 0.08  # per-tick cap around MEASURED pose (0.05 until 2026-09-24; measured to throttle a push to ~40% of what the policy asks)
    max_command_step_rad: 0.06  # consecutive published commands may differ by at most this (0.03 until 2026-09-24; both caps now scale the whole joint vector, see robot_anvil_openarm.py)
    obs_timeout_s: 2.0

  teleop:
    type: anvil_openarm_leader
    ros_prefix: leader_r
    joint_state_topic: /joint_states
    num_joints: 7
    urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
    target_frame_name: leader_r_hand_tcp
    step_sizes:
      x: 0.02
      y: 0.02
      z: 0.02
    obs_timeout_s: 2.0
    policy_controller: follower_r_forward_position_controller
    teleop_controller: teleop_controller
    follower_command_topic: /follower_r_forward_position_controller/commands
    follower_joint_prefix: follower_r

  processor:
    control_mode: leader

    observation:
      add_joint_velocity_to_observation: false
      add_current_to_observation: false
      add_ee_pose_to_observation: false
      display_cameras: false

    image_preprocessing:
      crop_params_dict: {}
      resize_size: [128, 128]

    gripper:
      use_gripper: false

    reset:
      fixed_reset_joint_positions: null
      # Now doubles as ArmsResetterClient.reset_and_wait()'s real timeout
      # (patches.py's patch_robot_env_reset_to_home_via_arms_resetter) --
      # devbox-observed real re-homing took ~3.2s (single waypoint; a startup dehome uses a longer 3-waypoint
      # profile) -- 18s gives a comfortable margin without
      # waiting forever if homing genuinely fails.
      reset_time_s: 18.0
      control_time_s: 20.0
      terminate_on_success: true

    inverse_kinematics:
      urdf_path: configs/hilserl/urdf/openarm_teleop_kinematics.urdf
      target_frame_name: follower_r_hand_tcp
      end_effector_bounds:
        min: [-0.0247, -0.4427, 0.1117]
        max: [0.4159, 0.0418, 0.40]  # z raised 0.309 -> 0.40 (2026-09-24): the homed pose is z~0.355, above the old ceiling, which forced a descent every episode
      end_effector_step_sizes:
        x: 0.02
        y: 0.02
        z: 0.02

    reward_classifier: null

# 2026-09-29: switched from the original 5-episode/626-frame Stage-5 demo set
# to demos_v2 (40 clean successful episodes/3150 frames, recorded from the
# homed start -- the same dataset BC v5 onward pretrains on) now that real RL
# training is finally being turned on: this is the RLPD offline half of the
# 50/50 mix once online_step_before_learning passes, so it should be at least
# as good/large as whatever BC already trains on, not the older, much smaller
# set. root is a container-internal path -- mount the HOST directory that
# actually holds it (data/datasets/_recordings/demos_v2) at this exact path
# via `-v .../data/datasets/_recordings/demos_v2:/tmp/demos_v2:ro` (read-only:
# the learner only ever reads this dataset, never writes to it).
dataset:
  repo_id: SSTC-AITeam/hilserl-push-bottle-demos-v2
  root: /tmp/demos_v2
  # Default video_backend (torchcodec) fails to load in this image --
  # missing libavutil.so.* (FFmpeg shared libs never installed here, this
  # image only needed video ENCODING via LeRobotDataset.create(), not
  # decoding, until this dataset-wiring change). Confirmed via a real
  # fake-hardware run: learner.py:992's make_dataset() crashed with
  # "Could not load libtorchcodec" for every FFmpeg ABI it tried, taking
  # the learner process down before it ever started serving gRPC (hence
  # the actor's endless "Waiting for Learner to be ready" timeout loop).
  # pyav (already installed, confirmed via `import av`) is lerobot's other
  # supported video_backend and doesn't need these shared libs -- matches
  # the same --dataset.video_backend=pyav workaround already used
  # throughout this session's anvil-trainer runs (unrelated root cause
  # there -- torch/torchcodec version mismatch -- same fix either way).
  video_backend: pyav

policy:
  type: sac
  # BC-pretrained actor (hilserl_bc_pretrain, 5 demos, 1500 steps, mse 0.14->0.005). Baked into the image so actor+learner both find it.
  # BC v2: 2106 frames (5 demos + 17 human-driven episodes from the 09:32 and 10:0x runs), 2000 steps.
  # BC v4: HIL-SERL ResNet-10 image encoder (frozen, pretrained) + wrist image + 7 joint states; trained on the 11 newest human-driven episodes.
  vision_encoder_name: /workspace/configs/hilserl/resnet10
  # Chained forward (2026-09-23): this is the RL-trained result of the first
  # real 4000-step session (started from bc_pretrained_v4). Checkpoint sweep
  # of that session (hilserl_eval_checkpoint against the original 5 demos)
  # showed a real but slow shape: error rose from BC's own 0.21 up to
  # ~0.40-0.50 over steps 250-1750, then steadily recovered back down to
  # ~0.20-0.21 by step 3250-4000 -- net result was roughly back to BC's
  # own starting quality, not clearly past it. Chaining forward (instead of
  # resetting to bc_pretrained_v4 every session, as every prior session
  # did) tests whether that initial dip-then-recover is an artifact of
  # restarting from a fresh BC checkpoint each time, or something that
  # recurs regardless of starting point -- see the plan's "Strategic
  # question" section for the full readout.
  # 2026-09-24: chained again, to the second 4000-step session's own final
  # checkpoint (rl_ckpt_0923_step4000 -> this). Session 2 (started from the
  # chained checkpoint) showed no early dip -- confirming the dip was a
  # restart-from-BC artifact -- but stayed flat (~0.19-0.24 error vs the
  # reference demos) rather than improving further.
  # 2026-09-24: back to the clean BC v4 start (was chained rl_ckpt_0924_step4000).
  # The chained RL checkpoints were trained while the follower's per-joint
  # limiters distorted every policy-driven motion (commanded EE motion did not
  # match actual motion -- see robot_anvil_openarm.py send_action), so their
  # policy-driven transitions taught the critic the wrong dynamics. They stayed
  # flat at ~0.2 error anyway. Chain forward again once a run under the fixed
  # limiter shows real progress.
  # 2026-09-24: BC v5-B -- trained on 45 clean successful demos recorded from the
  # homed start (idle lead-in trimmed, targets smoothed over 3 ticks, 5 episodes
  # held out; best checkpoint at step 1750). HELD-OUT correlation with the human's
  # action x/y/z = 0.69/0.84/0.91 (mean +0.816) vs +0.1..+0.3 for BC v4 on new data.
  # 2026-09-24: BC v6 = v5's 40 demos + 732 human-driven steps (20 segments, x3) from round-1
  # DAgger (BC v5-B driving, 10 episodes, 6 successes; the human did the descent every time).
  # Held-out demo corr +0.765 (the gate only covers demo frames, not the corrections).
  # 2026-09-24: BC v7 = demos + round-1 and round-2 DAgger corrections (BC v6 drove round 2:
  # 14 episodes, 10 successes, intervention rate still 0.3-0.57). Held-out demo corr +0.767.
  # 2026-09-29: BC v8 = demos + all three DAgger rounds (round-3: BC v7 drove, 10 episodes,
  # 8 successes). Held-out demo corr +0.760 -- statistically flat vs v6/v7, and intervention
  # rate has stayed ~0.4-0.5 across all three rounds: BC/DAgger alone has plateaued. This is
  # the last BC-only checkpoint before actually turning RL on (online_step_before_learning
  # left at its real default below for the first time -- every prior real session forced it
  # to 100000 via a CLI override specifically to isolate BC's own progress).
  pretrained_path: /workspace/configs/hilserl/bc_pretrained_v8
  device: cuda
  push_to_hub: false
  # 2026-09-24: official HIL-SERL docs (huggingface.co/docs/lerobot/en/hilserl,
  # "Key hyperparameters to tune") recommend cuda here when GPU memory is spare:
  # "removes CPU->GPU transfer overhead and can significantly increase the number
  # of learner updates per second". Default is cpu, which is what every session
  # before this one used. GPU 1 has ~98GB free; buffers here are ~1GB.
  storage_device: cuda
  use_torch_compile: false  # keep disabled -- avoid first-compile latency adding to an already cold-start-prone loop
  # SACPolicy.select_action() always stochastically samples from
  # Normal(mean, std) before tanh-squashing -- there's no deterministic/
  # "hold still" branch. Default policy_kwargs.std_max=10.0 means an
  # untrained policy's sampled (pre-squash) actions are huge relative to
  # the tanh range, so they saturate near +/-1 almost every tick, with a
  # fresh independent random draw each 100ms -- this is what produced the
  # "shook rapidly" symptom on occurrence #7. init_final=0.05 (unchanged,
  # still lerobot's default) already keeps the MEAN action small/near-zero
  # at init; lowering the sampling ceiling here keeps genuine SAC
  # exploration (still stochastic, still learns) while bounding how
  # extreme any single sampled action can be, so the untrained policy
  # should sit much closer to that near-zero mean instead of swinging
  # between extremes.
  policy_kwargs:
    std_max: 0.5
  # 2026-09-22: bumped from 1000 -- every session so far has been far
  # smaller than published HIL-SERL step counts for comparable tasks, and
  # reward is sparse/terminal (reward=1.0 only on the single step `s` is
  # pressed, 0.0 elsewhere -- confirmed via InterventionActionProcessorStep
  # source read), so the critic needs many optimization steps to propagate
  # that one signal backward through a ~100-200-step episode via TD
  # bootstrapping. This run is the direct test of whether "just needs more
  # training" (not reward sparsity itself) is the real bottleneck -- see
  # the plan's "Strategic question" section.
  online_steps: 4000  # ~30-40 episodes at this task's length; first real-RL attempt (2026-09-29) overrides this down to 1500 on the command line
  online_step_before_learning: 10  # start mixing in demo data almost immediately -- 2026-09-29: first session this is actually allowed to take effect (no more --policy.online_step_before_learning=100000 override)
  # SAC entropy bonus at the default temperature_init=1.0 blew the BC actor's std back up to the 0.5 cap within 250 steps
  # (sampling std 0.02 -> 0.5, error vs demos 0.045 -> 0.2 on checkpoints 250/500/1000). Start with a small temperature.
  # Frozen to 0 gradient by patch_sac_freeze_temperature() regardless -- temperature_init is now a real, permanent
  # value for the whole run, not just a starting point. With it this small, compute_loss_actor's entropy term is
  # negligible, so the actor's gradient is close to pure Q-maximization -- exactly what real RL training needs here.
  temperature_init: 0.01
  online_buffer_capacity: 2000
  # 2026-09-29: 2000 -> 4000 -- demos_v2 (3150 frames) replaced the original 626-frame demo
  # set above; ReplayBuffer.from_lerobot_dataset(..., capacity=offline_buffer_capacity)
  # (lerobot/rl/learner.py:1003-1011) truncates the offline dataset to this many frames, so
  # 2000 would have silently dropped over a third of the clean demo set from the RLPD mix.
  offline_buffer_capacity: 4000
  actor_learner_config:
    learner_host: 127.0.0.1
    learner_port: 50051

output_dir: outputs/hilserl_push_bottle
job_name: hilserl_push_bottle
seed: 42
# 2026-09-24: 8 (library default, never set before) -> 256. Offline experiment on the
# archived data (actor fixed, critic only): the critic's sensitivity to the ACTION --
# the only signal SAC's actor improves from -- was ~10x larger at batch 256 than at
# batch 8 (ratio 0.3% -> 3.0%, |dQ/da| 0.014 -> 0.119), and batch 8 reproduced the
# real runs' near-zero action gradient. Still small (data-limited), see the plan.
batch_size: 256
save_freq: 250  # intermediate checkpoints (counts optimization steps) so an early Ctrl+C does not lose everything
wandb:
  enable: false
