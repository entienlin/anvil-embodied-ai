# =============================================================================
# LeRobot Inference Configuration
# =============================================================================
# Parameters set via ROS2 launch args (not in this file):
#   model_path, device, control_frequency, image_height/width, echo_topic_only
#
# Model type and training flags are auto-read from the checkpoint.
# Only set fields here to override checkpoint values or provide runtime config.

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  # VLA task prompt — required for SmolVLA / Pi0 / Pi0.5, ignored for ACT / Diffusion
  # Set to the task the model was trained/finetuned for.
  task_description: "Pick up the white bottle and lift the trash can lid off the trash can. Then place the white bottle in the trash can and put the lid back down."

# -----------------------------------------------------------------------------
# Inference Tuning (per model type)
# -----------------------------------------------------------------------------
# Override checkpoint defaults. null = use the value the model was trained with.
# Only the section matching your model type is used; others are ignored.

inference_tuning:

  # ACT — lightweight transformer, single forward pass per chunk
  act:
    # n_action_steps: steps to execute before re-running inference.
    #   Tuning: jittery → raise; hesitates → lower; GPU slow → lower
    #   Set to 80 (matching the working 50ep baseline's trained value) to test
    #   against the act_100ep checkpoint, which was accidentally trained with
    #   60 instead of 80 — a real config mismatch, not intentional. The 100ep
    #   real-robot test showed heavy oscillation (path length ~30x net
    #   displacement per joint from monitor_output/inference_data.csv), and
    #   lower n_action_steps means more frequent re-planning/chunk-boundary
    #   transitions, which is one plausible contributor. This is a pure
    #   inference-time override — safe to try without retraining.
    n_action_steps: 80
    # temporal_ensemble_coeff: re-infers every step, exponentially weights
    #   overlapping predictions. Use 0.01 (paper default). Forces n_action_steps=1.
    temporal_ensemble_coeff: null

  # Diffusion — iterative denoising (UNet)
  diffusion:
    n_action_steps: null
    # num_inference_steps: denoising steps at inference time.
    #   Default (null) = num_train_timesteps (100). Set 10 for real-time (78ms vs 711ms).
    num_inference_steps: 10

  # SmolVLA — flow-matching action head with RTC guidance. Model-specific
  # fields here are forwarded generically (see _setup_model in
  # inference_node.py) to the loaded SmolVLAConfig if it has a matching
  # attribute; unknown keys are silently ignored.
  smolvla:
    # num_steps: Euler denoising iterations per inference call (flow matching).
    #   Pure inference-time hyperparameter — NOT baked into trained weights,
    #   safe to lower without retraining (same tradeoff as Diffusion's
    #   num_inference_steps above). Default (null) = training-time value (10).
    #   Real RTC guidance runs torch.enable_grad() + a backward pass per step,
    #   so this is markedly more expensive than plain forward-only denoising —
    #   on this rig, measured real per-call latency (mean ~1-3.4s, p95 ~8s)
    #   frequently exceeds chunk_size's execution budget (50 actions / 30Hz ≈
    #   1.67s), which triggers the same real_delay-exceeds-chunk-length
    #   clamp-to-empty behavior documented below for GR00T — except here it's
    #   probabilistic rather than certain, causing intermittent multi-second
    #   stalls instead of a permanent freeze. Lowering num_steps (e.g. 5) cuts
    #   per-call latency roughly in proportion to the step count, pushing more
    #   calls under that threshold. Try lowering gradually and watch for
    #   degraded action smoothness/precision before committing to a value.
    num_steps: 5

  # RTC — background-thread inference path. Real RTC guidance applies to
  # pi0/pi0.5/smolvla only. GR00T does NOT use this section — it runs on the
  # synchronous path (like ACT/Diffusion) instead. A "sham" RTC contract for
  # GR00T (patch_groot_for_rtc_dispatch() in model_loader.py, present but not
  # called) was tried and reverted: it fixed the synchronous path's
  # control-loop stalling (GR00T's ~16-action chunk gives only ~0.53s of
  # execution runway against its own ~3-4s inference latency), but real-robot
  # testing showed severe jerky motion at every chunk boundary — the
  # background thread re-triggers inference using a pre-chunk observation, so
  # each new chunk drives from robot state the model never saw. See the "GR00T
  # runs on the synchronous inference path" note in docs/inference.md for the
  # full history if revisiting this.
  #   Background thread runs inference continuously; control loop reads from ActionQueue.
  rtc:
    # inference_delay: fallback step-count for first inference before LatencyTracker kicks in.
    #   Real-robot tuned: ceil(~330ms × 30Hz) ≈ 10. Auto-adjusted after first inference.
    inference_delay: 10
    # queue_trigger_threshold: re-trigger inference when queue depth ≤ this.
    #   Set equal to chunk_size for maximum RTC overlap.
    #   Raised from 50 → 300 after the first real pi0.5 test (chunk_size=400):
    #   at 50, the background thread only got a 1.67s head start (50/30Hz)
    #   before the queue could hit empty, but pi0.5's real per-call latency
    #   measures mean~6s / p95~9.3s on this rig — nowhere near enough lead
    #   time. Confirmed on real hardware: `VLA queue` repeatedly hit 0
    #   (Action FPS collapsing to ~7-17Hz in those windows), which is exactly
    #   the "motion isn't continuous" symptom. 300/30Hz ≈ 10s of head start
    #   comfortably covers the observed p95. Shared with SmolVLA (chunk=300);
    #   harmless there too — its own real_delay (85-155) is well under 300, so
    #   this just makes its background thread re-trigger immediately after
    #   every merge (continuous overlap) rather than waiting, which trades a
    #   bit of extra GPU compute for a bigger safety margin, not a behavior
    #   regression.
    queue_trigger_threshold: 300
    # execution_horizon: steps used from each chunk before re-inferring.
    #   Higher → less frequent inference, slower reaction. Lower → faster reaction.
    execution_horizon: 12
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP

# -----------------------------------------------------------------------------
# Joint Configuration
# -----------------------------------------------------------------------------
joint_state_topic: "/joint_states"

joint_names:
  # Joint order as output by ML model (must match training dataset)
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7

  # Joint order expected by ROS2 forward_position_controller
  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1

  # arm_mapping controls how observation.state is assembled:
  #   Keys are used in joint name lookup: f"{observation_prefix}_{arm_key}_{joint_id}"
  #   For bimanual Anvil robot: {l: left, r: right} → 2×8 = 16 DOF state
  #   For pi05_libero_finetuned (single-arm, 8 DOF): use only one arm below.
  arm_mapping:
    l: left
    r: right

  # Anvil bimanual model uses position + velocity + effort as state inputs
  state_features:
    - position

# -----------------------------------------------------------------------------
# Arm Configuration
# -----------------------------------------------------------------------------
# ML model outputs: action = [left_joints..., right_joints...]
# Split and publish to separate controller topics

arms:
  left:
    ros_prefix: "follower_l"
    command_topic: "/follower_l_forward_position_controller/commands"
    action_start: 0
    action_end: 8
  right:
    ros_prefix: "follower_r"
    command_topic: "/follower_r_forward_position_controller/commands"
    action_start: 8
    action_end: 16

# -----------------------------------------------------------------------------
# Camera Configuration
# -----------------------------------------------------------------------------

cameras:
  # fps: expected publish rate; warning fires when any camera drops below fps * 2/3.
  #   Independent of control_frequency.
  fps: 30.0

  # mapping: ROS topic -> ML model camera name (must match training config)
  mapping:
    "/cam_waist/image_raw/compressed": "waist"
    "/cam_wrist_r/image_raw/compressed": "wrist_r"
    "/cam_chest/image_raw/compressed": "chest"
    "/cam_wrist_l/image_raw/compressed": "wrist_l"

  # fps_overrides: per-topic overrides for cameras running at a different rate.
  #   Omit topics that match the global fps above.
  # fps_overrides:
  #   "/cam_wrist_r/image_raw/compressed": 60.0

# -----------------------------------------------------------------------------
# Safety Parameters
# -----------------------------------------------------------------------------
# max_position_delta: maximum joint position change per step (radians).
# min_position_delta: minimum per-joint change required to publish a new command (radians).
#   Use to overcome motor friction when model delta outputs are too small to move joints.
#   Commands are held at last published value until cumulative change exceeds this threshold.
#   Default: disabled (null). Recommended starting value: 0.05.
# Uncomment to override defaults:
safety:
  max_position_delta: 0.30
#   min_position_delta: 0.05
